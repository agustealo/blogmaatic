name: Trusted Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: validate-release-authority
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"

      - name: Fetch master authority
        run: git fetch --no-tags origin master:refs/remotes/origin/master

      - name: Install locked graph
        run: npm ci --ignore-scripts

      - name: Validate tag, version, lockfile, and source ancestry
        env:
          BLOGMAATIC_RELEASE_TAG: ${{ github.ref_name }}
        run: npm run release:validate

  build:
    name: release-${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-24.04
          - target: macos-arm64
            os: macos-15
          - target: macos-x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"

      - name: Install locked build graph
        run: npm ci --ignore-scripts

      - name: Build production workspaces
        run: npm run build

      - name: Reinstall locked production graph
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules
          npm ci --omit=dev --ignore-scripts

      - name: Stage portable distribution
        run: npm run distribution:stage

      - name: Require Apple release credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_DEVELOPER_ID_INSTALLER: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          for name in \
            APPLE_DEVELOPER_ID_CERT_P12_BASE64 \
            APPLE_DEVELOPER_ID_CERT_PASSWORD \
            APPLE_DEVELOPER_ID_APPLICATION \
            APPLE_DEVELOPER_ID_INSTALLER \
            APPLE_NOTARY_KEY_ID \
            APPLE_NOTARY_ISSUER_ID \
            APPLE_NOTARY_PRIVATE_KEY_BASE64; do
            test -n "${!name:-}" || { echo "Missing required release secret: ${name}" >&2; exit 1; }
          done

      - name: Import Developer ID signing identities
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          cert_path="$RUNNER_TEMP/blogmaatic-developer-id.p12"
          keychain_path="$RUNNER_TEMP/blogmaatic-release.keychain-db"
          keychain_password="blogmaatic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s' "$APPLE_DEVELOPER_ID_CERT_P12_BASE64" | base64 --decode > "$cert_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" -k "$keychain_path" -P "$APPLE_DEVELOPER_ID_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/pkgbuild -T /usr/bin/productsign
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"
          rm -f "$cert_path"

      - name: Build Linux native package
        if: runner.os == 'Linux'
        run: npm run distribution:native

      - name: Build signed macOS native package
        if: runner.os == 'macOS'
        env:
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_DEVELOPER_ID_INSTALLER: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER }}
        run: npm run distribution:native -- --signed

      - name: Burn portable distribution
        shell: bash
        run: |
          set -euo pipefail
          archive=$(find artifacts -maxdepth 1 -type f -name 'blogmaatic-*.tar.gz' -print -quit)
          test -n "$archive"
          npm run distribution:smoke -- "$archive"

      - name: Burn native installer
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            package=$(find artifacts -maxdepth 1 -type f -name 'blogmaatic-*.deb' -print -quit)
          else
            package=$(find artifacts -maxdepth 1 -type f -name 'blogmaatic-*.pkg' -print -quit)
          fi
          test -n "$package"
          npm run distribution:native:smoke -- "$package"

      - name: Notarize and staple macOS installer
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          package=$(find artifacts -maxdepth 1 -type f -name 'blogmaatic-*.pkg' -print -quit)
          test -n "$package"
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf '%s' "$APPLE_NOTARY_PRIVATE_KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          xcrun notarytool submit "$package" \
            --key "$key_path" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait \
            --timeout 30m
          xcrun stapler staple "$package"
          xcrun stapler validate "$package"
          pkgutil --check-signature "$package"
          package_dir=$(dirname "$package")
          package_name=$(basename "$package")
          (cd "$package_dir" && shasum -a 256 "$package_name" > "$package_name.sha256")
          rm -f "$key_path"

      - name: Attest Linux release bytes
        if: runner.os == 'Linux'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/blogmaatic-*.tar.gz
            artifacts/blogmaatic-*.deb

      - name: Attest macOS release bytes
        if: runner.os == 'macOS'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/blogmaatic-*.pkg

      - name: Upload Linux release inputs
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            artifacts/blogmaatic-*.tar.gz
            artifacts/blogmaatic-*.tar.gz.sha256
            artifacts/blogmaatic-*.deb
            artifacts/blogmaatic-*.deb.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload macOS release inputs
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            artifacts/blogmaatic-*.pkg
            artifacts/blogmaatic-*.pkg.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: publish-trusted-release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"

      - name: Download verified release inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate release manifest and checksums
        env:
          BLOGMAATIC_RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/generate-release-metadata.mjs release-assets

      - name: Attest release metadata and checksum sidecars
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-assets/*.sha256
            release-assets/SHA256SUMS
            release-assets/release-manifest.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag \
            --generate-notes \
            --title "Blogmaatic $GITHUB_REF_NAME"

      - name: Verify published release attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release verify "$GITHUB_REF_NAME"
