name: Product Media

on:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/product-media.yml"
      - "apps/control-room/**"
      - "apps/runtime/**"
      - "packages/control-plane/**"
      - "packages/extension-jekyll-git/**"
      - "packages/extension-sdk/**"
      - "packages/operator-api/**"
      - "packages/operator-client/**"
      - "scripts/capture-product-screenshots.mjs"
      - "scripts/smoke-consumer-publishing.mjs"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: real-control-room-screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Build production workspaces
        run: npm run build

      - name: Burn canonical consumer publishing journey
        run: node scripts/smoke-consumer-publishing.mjs

      - name: Capture real Control Room product media
        run: npm run product:screenshots

      - name: Verify screenshot contract
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            01-first-run-setup.png
            02-first-run-ready.png
            03-connections.png
            04-control-room-overview.png
            05-automations.png
            06-runs.png
            07-run-detail.png
            08-operations.png
            09-publication-groups.png
            10-publications.png
            11-schedules.png
            12-mobile-publications.png
            13-mobile-publication-groups.png
            14-mobile-schedules.png
            capture-manifest.json
          )
          for asset in "${expected[@]}"; do
            test -s "docs/screenshots/${asset}"
          done
          test "$(find docs/screenshots -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 14
          node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync("docs/screenshots/capture-manifest.json", "utf8"));
            if (manifest.sourceCommit !== process.env.GITHUB_SHA) {
              throw new Error(`Screenshot manifest source ${manifest.sourceCommit} does not match exact head ${process.env.GITHUB_SHA}`);
            }
            if (manifest.source !== "real-runtime-capture") throw new Error("Screenshot manifest is not a real-runtime capture");
            if (manifest.captures.length !== 14) throw new Error(`Expected 14 canonical captures, got ${manifest.captures.length}`);
            const mobile = manifest.captures.filter((item) => item.viewport === "mobile");
            if (mobile.length !== 3) throw new Error(`Expected 3 mobile captures, got ${mobile.length}`);
            if (!manifest.fixture?.schedule) throw new Error("Schedule fixture evidence is missing");
          '

      - name: Report exact-head media evidence
        shell: bash
        run: |
          set -euo pipefail
          sha256sum docs/screenshots/*.png docs/screenshots/capture-manifest.json
          echo "Product Media is evidence-only. It never rewrites the candidate SHA it is certifying."
